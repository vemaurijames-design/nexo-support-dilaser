spring.application.name=nexo-support-api

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/nexo_support
spring.datasource.username=superadministrador
spring.datasource.password=1234567
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — Flyway maneja el schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.clean-disabled=false
spring.flyway.clean-on-validation-error=true
spring.flyway.locations=classpath:db/migration

# Multipart (logo / adjuntos)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Correo (olvidar contraseña / RMA) — configurar con tus datos reales
