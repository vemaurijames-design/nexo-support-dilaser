spring:
  application:
    name: nexo-support-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexo_support}
    username: ${DB_USER:superadministrador}
    password: ${DB_PASSWORD:1234567}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB
  mail:
    host: ${MAIL_HOST:smtp.office365.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  thymeleaf:
    check-template-location: true

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

nexo:
  jwt:
    secret: ${JWT_SECRET:CambiaEstaClaveSuperSecretaDeNexoSupport2026Dilaser32}
    access-minutes: 15
    refresh-days: 7
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  storage:
    path: ${STORAGE_PATH:./data/storage}
  mail:
    from: ${MAIL_FROM:iris.p@example.org}
  whatsapp:
    enabled: ${WA_ENABLED:false}
    phone-id: ${WA_PHONE_ID:}
    token: ${WA_TOKEN:}
    template-preventivo: recordatorio_preventivo

logging:
  level:
    co.dilaser.nexo: INFO
    org.springframework.security: INFO
