services:
  postgres:
    image: postgres:16-alpine
    container_name: nexo-postgres
    environment:
      POSTGRES_DB: nexo_support
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo123
    ports:
      - "5432:5432"
    volumes:
      - nexo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo_support"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexo_pg:
